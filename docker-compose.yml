services:
  job-radar:
    build: .
    container_name: job-radar
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${LOG_DIR:-./logs}:/app/logs"
    restart: unless-stopped
